<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>FP1級 合格ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Old+Mincho:wght@700;900&display=swap">
<style>
/* Layout: one-column phone app — header strip, scrolling sheet, fixed bottom tab bar. Ledger-paper ground, ink-navy text, hanko-red for mistakes, pine-green for correct. */
:root{
  --bg:#f3f4ef; --sheet:#fbfbf8; --ink:#1d2433; --sub:#5d6474; --line:#d9dccf;
  --accent:#23407a; --accent-soft:#e3e9f5; --ok:#1f7a55; --ok-soft:#e0f1e8;
  --ng:#b8322a; --ng-soft:#f8e3e0; --warn:#9a6a00; --warn-soft:#fbefd2;
  --display:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151c; --sheet:#1a1e27; --ink:#e7e9ee; --sub:#9aa1b0; --line:#2c3240;
  --accent:#8fb0ee; --accent-soft:#223050; --ok:#5ccf9b; --ok-soft:#173528;
  --ng:#f08a80; --ng-soft:#3d1e1c; --warn:#e7b94f; --warn-soft:#3a2f14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151c; --sheet:#1a1e27; --ink:#e7e9ee; --sub:#9aa1b0; --line:#2c3240;
  --accent:#8fb0ee; --accent-soft:#223050; --ok:#5ccf9b; --ok-soft:#173528;
  --ng:#f08a80; --ng-soft:#3d1e1c; --warn:#e7b94f; --warn-soft:#3a2f14; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:12px 110px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:8px 4px}
header.top h1{font-family:var(--display);font-weight:900;font-size:1.35rem;margin:0;letter-spacing:.04em}
header.top .sync{font-size:.75rem;color:var(--sub)}
h2{font-family:var(--display);font-size:1.1rem;margin:0;text-wrap:balance}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:16px}
.muted{color:var(--sub);font-size:.85rem}
.label{font-size:.72rem;letter-spacing:.08em;color:var(--sub);font-weight:700}
.big{font-family:var(--display);font-size:2.4rem;line-height:1.1;font-variant-numeric:tabular-nums}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{appearance:none;border:1px solid var(--line);background:var(--sheet);color:var(--ink);font:inherit;font-weight:700;border-radius:8px;padding:12px 14px;cursor:pointer;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px}
.btn:focus-visible,.tab:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.today{display:flex;gap:16px;align-items:center}
.today .grow p{margin:4px 0 0}
.chip{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.chip.kaisei{background:var(--warn-soft);color:var(--warn)}
.chip.ng{background:var(--ng-soft);color:var(--ng)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.field{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.field:first-of-type{border-top:0}
.field .name{font-weight:700;font-size:.95rem}
.field .nums{font-size:.8rem;color:var(--sub);font-variant-numeric:tabular-nums}
.bar{grid-column:1/-1;height:8px;border-radius:4px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .m{background:var(--ok)} .bar .l{background:var(--accent);opacity:.55} .bar .w{background:var(--ng)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.75rem;color:var(--sub)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;background:var(--c)}
/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.8rem;color:var(--sub)}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qtext{font-size:1.05rem;line-height:1.85;margin:0;white-space:pre-wrap}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf .btn{font-family:var(--display);font-size:2rem;min-height:84px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{appearance:none;font:inherit;color:var(--ink);text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;display:flex;gap:10px;min-height:48px}
.opt b{font-family:var(--display);color:var(--accent)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--ng);background:var(--ng-soft)}
.verdict{display:flex;align-items:center;gap:12px}
.stamp{font-family:var(--display);font-weight:900;font-size:1.6rem;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;border:3px solid currentColor;transform:rotate(-8deg);flex:none}
.stamp.ok{color:var(--ok)} .stamp.ng{color:var(--ng)}
@media (prefers-reduced-motion:no-preference){.stamp{animation:press .22s ease-out}}
@keyframes press{from{transform:scale(1.4) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(-8deg);opacity:1}}
.exp{border-left:3px solid var(--accent);padding:4px 0 4px 12px;margin:0;white-space:pre-wrap}
.rate{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* forms */
label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--sub);font-weight:700}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:44px;width:100%}
.form3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:10px;align-items:flex-start;padding-block:12px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .grow p{margin:2px 0 0;font-size:.9rem}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.item .acts .btn{min-height:40px;padding:6px 10px;font-size:.85rem}
a{color:var(--accent)}
/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tab{appearance:none;border:0;background:none;font:inherit;color:var(--sub);font-size:.72rem;font-weight:700;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.note{font-size:.78rem;color:var(--sub);line-height:1.6}
.empty{text-align:center;padding:24px 8px;color:var(--sub)}
.badge{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--ng);color:var(--sheet);font-size:.75rem;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.rate3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.rate3 .btn{padding:10px 6px;font-size:.85rem}
.exam{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid var(--line)}
.cells{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.cell{appearance:none;font:inherit;font-size:.7rem;font-variant-numeric:tabular-nums;border:1px solid var(--line);background:var(--bg);color:var(--sub);border-radius:4px;aspect-ratio:1;max-width:100%;padding:0;cursor:pointer;min-width:0}
.cell.m{background:var(--ok);border-color:var(--ok);color:var(--sheet)}.cell.l{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}.cell.w{background:var(--ng);border-color:var(--ng);color:var(--sheet)}
.cell.cur{outline:2px solid var(--ink);outline-offset:1px}
.qimg{display:block;width:100%;max-width:100%;height:auto;border-radius:6px;background:#fff;border:1px solid var(--line)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .qimg{filter:invert(.88) hue-rotate(180deg)}}
:root[data-theme="dark"] .qimg{filter:invert(.88) hue-rotate(180deg)}
.lawnote{background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:.88rem;line-height:1.7}
.lawnote strong{display:block;color:var(--warn)}
.qhead2{margin:0;font-size:.85rem;line-height:1.7;color:var(--sub);white-space:pre-wrap}
.imgbox summary,.sibs summary{cursor:pointer;font-size:.85rem;font-weight:700;color:var(--accent);padding-block:4px}
.imgbox[open] summary{margin-bottom:6px}
.sibs ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.sibs li{display:flex;gap:8px;font-size:.88rem;line-height:1.65;padding:6px 8px;border-radius:6px}
.sibs li.me{background:var(--accent-soft)}
.sibs b{font-family:var(--display);flex:none}
.tok{color:var(--ok)} .tng{color:var(--ng)}
.tf .btn.isans{border-width:3px;border-color:currentColor}
.unk{font-size:.95rem;min-height:48px;color:var(--sub)}
.unk.mine{border-width:3px;border-color:var(--sub)}
.stamp.uk{color:var(--sub)}
.calc summary{cursor:pointer;font-size:.9rem;font-weight:700;color:var(--accent);padding-block:4px}
.calc .disp{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px 10px;text-align:right;font-variant-numeric:tabular-nums;margin-block:6px}
.calc .ex{font-size:.95rem;color:var(--sub);min-height:1.4em;word-break:break-all}
.calc .res{font-size:1.5rem;font-weight:700;min-height:1.4em;word-break:break-all}
.calc .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc .keys .btn{min-height:46px;font-size:1.1rem;padding:4px}
.calc .keys .op{color:var(--accent)}
.tutlog{display:flex;flex-direction:column;gap:8px}
.tmsg{border-radius:10px;padding:8px 10px;line-height:1.7;white-space:pre-wrap;font-size:.95rem}
.tmsg.me{align-self:flex-end;background:var(--accent);color:var(--sheet);max-width:85%}
.tmsg.ai{background:var(--bg);border:1px solid var(--line)}
.tmsg.err{color:var(--ng);font-size:.85rem}
.tspk{float:right;min-height:32px;padding:2px 8px;margin:0 0 4px 6px;font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{min-height:40px;font-size:.85rem;padding:4px 10px}
.tact{margin-top:6px}
.tutf{margin-top:8px;gap:8px}.tutf .btn{font-size:1.5rem;min-height:56px}.tsave{min-height:34px;font-size:.8rem;padding:2px 10px}
.tnote{margin-top:6px;font-size:.8rem;color:var(--ok)}
.expbox.mine{border-color:var(--accent)}
.ptbox{border:2px solid var(--accent);border-radius:10px;padding:10px 12px;background:var(--sheet)}
.ptbox .pt1{font-weight:700;margin:4px 0;line-height:1.7}
.ptbox .ptc{margin:4px 0;line-height:1.7}
.ptr{margin:4px 0 0;padding-left:1.2em;line-height:1.7}.ptr li{margin-bottom:3px}
.stuck li{display:flex;justify-content:space-between;gap:8px;padding-block:4px;border-bottom:1px solid var(--line);font-size:.9rem}
.vbar{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px dashed var(--line)}
.vbar .btn{min-height:40px;padding:6px 12px;font-size:.85rem}
.vmic{color:var(--ng)}
.seg{display:flex;flex-direction:column;gap:6px}
.segopt{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:700;font-size:.92rem}
.segopt input{width:auto;min-height:0;accent-color:var(--accent)}
.segopt:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
label.chk{display:flex;gap:8px;align-items:center;font-size:.85rem}
label.chk input{width:auto;min-height:0}
.expbox{background:var(--bg);border-radius:8px;padding:12px 14px}
.expbox p{margin:4px 0 0;line-height:1.8;font-size:.98rem}
.sibs li small{display:block;color:var(--sub);font-size:.8rem;margin-top:2px}
.src summary{cursor:pointer;font-size:.78rem;color:var(--sub)}
.src p{font-size:.75rem;color:var(--sub);line-height:1.6;margin:6px 0 0}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.85rem}
</style>

<script>
/* ===== 問題データ（すべてオリジナル作成。2027年1月試験＝法令基準日2026年10月1日を想定） ===== */
const CATS={L:"ライフプランニング",R:"リスク管理",K:"金融資産運用",T:"タックスプランニング",F:"不動産",S:"相続・事業承継"};
const Q=[
// ---- ライフ ----
{id:"L01",c:"L",k:1,q:"2026年度の老齢基礎年金の満額（67歳以下の人）は、847,300円である。",a:"o",e:"2026年度の満額は847,300円（68歳以上は844,900円）。2025年度は831,700円だったので、年度ごとの金額の違いに注意。"},
{id:"L02",c:"L",k:1,q:"2026年4月以降、在職老齢年金は、総報酬月額相当額と老齢厚生年金の基本月額の合計が51万円を超えると、超えた額の2分の1が支給停止となる。",a:"x",e:"基準額は65万円に引き上げられた（2025年度は51万円）。「超えた額の2分の1が止まる」という仕組みは変わらない。"},
{id:"L03",c:"L",k:1,q:"離婚時の年金分割の請求期限は、原則として離婚等をした日の翌日から5年以内である。",a:"o",e:"従来の2年以内から5年以内に延長された。"},
{id:"L04",c:"L",k:1,q:"2026年10月から、1歳未満の子を養育する国民年金第1号被保険者は、届出により国民年金保険料が免除され、その期間は保険料納付済期間として扱われる。",a:"o",e:"育児期間の免除制度の創設。実母は産前産後免除の後から、それ以外の人は出産後から、子が1歳になる月の前月までが対象。年金額は減らない（納付済扱い）。"},
{id:"L05",c:"L",k:0,q:"1962年4月2日以後生まれの人が老齢基礎年金を繰り上げて受給する場合、減額率は1カ月あたり0.5％である。",a:"x",e:"減額率は1カ月あたり0.4％（60歳0カ月で最大24％減）。0.5％は以前の率。繰下げの増額率は1カ月あたり0.7％で、75歳まで（最大84％増）。"},
{id:"L06",c:"L",k:1,q:"フラット35の借入額の上限は8,000万円である。",a:"x",e:"上限は1億2,000万円に引き上げられた。また一戸建て等の床面積要件は70㎡以上から50㎡以上に緩和（マンション等は30㎡以上のまま）。"},
{id:"L07",c:"L",k:1,q:"企業型DCのマッチング拠出では、加入者掛金の額を事業主掛金の額以下としなければならない。",a:"x",e:"この「事業主掛金以下」という制限は撤廃された。拠出限度額の範囲内であれば、加入者掛金が事業主掛金を上回ってもよい。"},
{id:"L08",c:"L",k:1,q:"出生後休業支援給付金は、一定の要件を満たす育児休業について、28日を限度に休業開始時賃金日額の13％相当額が支給されるもので、育児休業給付金（67％）とあわせると80％となる。",a:"o",e:"2025年4月創設。夫婦それぞれが通算14日以上の育休を取ることなどが要件。手取りでみるとほぼ10割になる。"},
{id:"L09",c:"L",k:1,q:"育児時短就業給付金は、3歳未満の子を養育するために時短勤務をしている場合に、時短勤務中の賃金の20％を上限に支給される。",a:"x",e:"対象は2歳未満の子。支給額は原則として時短勤務中の賃金の10％。"},
{id:"L10",c:"L",k:1,q:"自己都合で退職した人に対する基本手当の給付制限期間は、原則として1カ月である。",a:"o",e:"2025年4月から原則2カ月→1カ月に短縮。なお、退職前1年以内に一定の教育訓練を受けた場合などは給付制限なし。"},
{id:"L11",c:"L",k:1,q:"2025年4月以降に60歳になった人の高年齢雇用継続基本給付金の給付率は、最大で各月の賃金の15％である。",a:"x",e:"最大10％に縮小された（賃金が60歳時点の64％以下に下がった場合）。"},
{id:"L12",c:"L",k:0,q:"健康保険の傷病手当金は、支給を始めた日から通算して1年6カ月まで支給される。",a:"o",e:"途中で出勤した期間があっても、その分は延長され「通算」1年6カ月になる。支給額は標準報酬日額の3分の2相当。"},
{id:"L13",c:"L",k:0,q:"出産育児一時金の額は、産科医療補償制度に加入している医療機関で出産した場合、1児につき50万円である。",a:"o",e:"2023年4月から50万円（未加入の医療機関では48万8,000円）。"},
{id:"L14",c:"L",k:1,q:"労災保険の葬祭料は、33万円に給付基礎日額の30日分を加えた額（その額が給付基礎日額の60日分に満たない場合は60日分）である。",a:"o",e:"定額部分が31万5,000円から33万円に引き上げられた。"},
{id:"L15",c:"L",k:1,q:"高等学校等就学支援金は、世帯の収入が一定額以下の場合に限り支給される。",a:"x",e:"所得制限が撤廃され、保護者の収入にかかわらず支給されるようになった。"},
{id:"L16",c:"L",k:0,q:"加給年金額の対象となる配偶者が、厚生年金の被保険者期間20年以上の老齢厚生年金の受給権を有している場合、実際に受給していなくても加給年金額は支給停止となる。",a:"o",e:"2022年4月以降は「受給権があるかどうか」で判断する。"},
{id:"L17",c:"L",k:1,q:"日本政策金融公庫の教育一般貸付（国の教育ローン）の返済期間は、最長18年である。",a:"x",e:"2025年4月から最長20年に延長された。"},
{id:"L18",c:"L",k:1,q:"2026年8月から、高額療養費の自己負担限度額が引き上げられるとともに、年間での上限額が新たに設けられた。",a:"o",e:"月ごとの上限に加え、年間の上限が新設された。"},
{id:"L19",c:"L",k:0,type:"mc",q:"1961年10月生まれの人が、老齢基礎年金を72歳0カ月で繰下げ受給した場合の増額率として、正しいものはどれか。",ch:["42.0％","50.4％","58.8％","84.0％"],a:2,e:"65歳から72歳0カ月までは84カ月。84×0.7％＝58.8％。"},
// ---- リスク ----
{id:"R01",c:"R",k:1,q:"2026年分・2027年分の所得税では、23歳未満の扶養親族がいる場合、新契約の一般生命保険料控除の適用限度額が6万円に引き上げられる。",a:"o",e:"通常4万円のところ6万円に（時限措置）。子育て世帯への支援が目的。"},
{id:"R02",c:"R",k:1,q:"経済価値ベースのソルベンシー比率の導入に伴い、早期是正措置の対象となる基準は「200％未満」とされた。",a:"x",e:"新方式では基準は100％未満。200％未満は従来方式（ソルベンシー・マージン比率）の基準。"},
{id:"R03",c:"R",k:0,q:"生命保険契約者保護機構による補償は、破綻時点の責任準備金等の90％まで（高予定利率契約を除く）である。",a:"o",e:"「保険金額の90％」ではなく「責任準備金等の90％」である点がひっかけポイント。"},
{id:"R04",c:"R",k:0,q:"地震保険の保険金額は、主契約である火災保険の保険金額の30％～50％の範囲内で、建物5,000万円、家財1,000万円が上限である。",a:"o",e:"損害区分は全損・大半損・小半損・一部損の4区分で、それぞれ保険金額の100％・60％・30％・5％。"},
{id:"R05",c:"R",k:0,q:"法人が契約する定期保険で、最高解約返戻率が50％超70％以下の場合、保険期間の前半4割の期間は支払保険料の40％を資産計上し、60％を損金に算入する。",a:"o",e:"70％超85％以下なら60％資産計上・40％損金。85％超は解約返戻率に応じた別の計算。50％以下は全額損金（原則）。"},
{id:"R06",c:"R",k:0,q:"契約者（保険料負担者）が夫、被保険者が妻、死亡保険金受取人が子である生命保険で、妻が死亡し子が受け取った死亡保険金は、相続税の課税対象となる。",a:"x",e:"契約者・被保険者・受取人がすべて別人なので贈与税の対象。相続税になるのは「契約者＝被保険者」で受取人が別のとき。"},
{id:"R07",c:"R",k:0,q:"自動車損害賠償責任保険の支払限度額は、被害者1人につき死亡3,000万円、傷害120万円、後遺障害は最高4,000万円である。",a:"o",e:"自賠責は対人賠償のみ。物損は対象外。"},
{id:"R08",c:"R",k:0,q:"借家人が軽過失により借家を焼失させた場合、失火責任法により、家主に対する損害賠償責任を負わない。",a:"x",e:"家主には「元の状態で返す」約束を果たせない（債務不履行）ため、軽過失でも責任を負う。失火責任法で守られるのは隣家などへの不法行為責任。"},
{id:"R09",c:"R",k:0,q:"保険契約のクーリング・オフは、契約の申込日または契約申込書面の交付日のいずれか遅い日から8日以内に行う必要があり、書面のほか電磁的記録でも行うことができる。",a:"o",e:"保険期間1年以内の契約や、法人が結ぶ契約、医師の診査を受けた契約などは対象外。"},
{id:"R10",c:"R",k:0,q:"個人年金保険料控除の適用を受けるためには、年金受取人が契約者またはその配偶者であり、確定年金の場合は年金受取期間が10年以上であることなどの要件を満たす必要がある。",a:"o",e:"ほかに、保険料払込期間10年以上、年金開始が60歳以後などの要件がある。"},
// ---- 金融 ----
{id:"K01",c:"K",k:1,q:"TOPIX（東証株価指数）は、東京証券取引所のプライム市場に上場する全銘柄を対象とする指数である。",a:"x",e:"組入れ対象はプライム・スタンダード・グロースの全市場区分に広がった。日経平均株価はプライム市場の225銘柄。"},
{id:"K02",c:"K",k:1,q:"投資信託協会と日本投資顧問業協会は統合し、資産運用業協会となった。",a:"o",e:"運用業界の自主規制団体が1つにまとまった。"},
{id:"K03",c:"K",k:0,q:"NISAの成長投資枠の年間投資枠は240万円、つみたて投資枠は120万円であり、非課税保有限度額は合計1,800万円（うち成長投資枠1,200万円）である。",a:"o",e:"非課税期間は無期限。売却すると、その簿価分の枠が翌年以降に復活する。"},
{id:"K04",c:"K",k:0,q:"外貨預金は、預金保険制度による保護の対象である。",a:"x",e:"外貨預金は対象外。決済用預金（無利息・要求払い・決済サービス）は全額保護、それ以外は元本1,000万円とその利息まで。"},
{id:"K05",c:"K",k:0,q:"上場株式の配当について確定申告をする場合、所得税と個人住民税とで異なる課税方式を選択することができる。",a:"x",e:"2024年分以後は、所得税で選んだ方式が住民税にも自動的に適用される（一致させる）。"},
{id:"K06",c:"K",k:0,q:"J-REIT（上場不動産投資信託）から受け取る分配金は、総合課税を選択すれば配当控除の適用を受けることができる。",a:"x",e:"J-REITの分配金は配当控除の対象外。"},
{id:"K07",c:"K",k:0,q:"米ドルの外貨預金に円を預け入れる際に適用される為替レートは、TTM（仲値）に1円を加えたTTSである。",a:"o",e:"預け入れ（円→外貨）はTTS、払い戻し（外貨→円）はTTB（TTM－1円）。"},
{id:"K08",c:"K",k:0,q:"シャープレシオは、ポートフォリオの収益率から無リスク資産利子率を差し引いた値を、ポートフォリオの標準偏差で割って求める。",a:"o",e:"リスク1単位あたりの超過リターン。数値が大きいほど効率よく運用できたと判断する。"},
{id:"K09",c:"K",k:0,q:"金融サービス提供法では、金融商品販売業者等が重要事項の説明義務に違反した場合、元本欠損額が顧客の損害額と推定される。",a:"o",e:"顧客は損害額を自分で証明しなくてよい。断定的判断の提供も禁止されている。"},
{id:"K10",c:"K",k:0,q:"日本投資者保護基金は、証券会社が破綻し、分別管理の不備などで顧客資産が返還されない場合に、顧客1人あたり1,000万円まで補償する。",a:"o",e:"銀行で購入した投資信託は対象外（銀行は基金の会員ではない）。"},
{id:"K11",c:"K",k:0,q:"プットオプションの買い手は、原資産価格が下落した場合に利益が得られ、損失はプレミアム（オプション料）に限定される。",a:"o",e:"売り手は利益がプレミアムに限られ、損失は大きくなりうる。"},
{id:"K12",c:"K",k:0,type:"mc",q:"表面利率1.0％、残存期間5年の固定利付債券を98円で購入した場合の最終利回り（単利・年率）に最も近いものはどれか。",ch:["1.02％","1.22％","1.43％","1.40％"],a:2,e:"{1.0＋(100－98)÷5}÷98×100＝1.4÷98×100≒1.4286％。分母は購入価格。"},
{id:"K13",c:"K",k:0,type:"mc",q:"当期純利益50億円、自己資本500億円、総資産1,250億円の企業のROE（自己資本利益率）はどれか。",ch:["4％","10％","25％","40％"],a:1,e:"ROE＝当期純利益÷自己資本×100＝50÷500×100＝10％。総資産で割るとROA（4％）。"},
{id:"K14",c:"K",k:0,q:"特定公社債の利子は、申告分離課税の対象であるが、確定申告不要を選択することもできる。",a:"o",e:"税率は20.315％。申告分離を選べば上場株式等の譲渡損失と損益通算できる。"},
// ---- タックス ----
{id:"T01",c:"T",k:1,q:"2026年分の所得税において、合計所得金額2,350万円以下の人に適用される基礎控除の本則の額は62万円である。",a:"o",e:"58万円→62万円に引き上げ。さらに合計所得489万円以下の人は42万円加算で104万円（2026・2027年分）。"},
{id:"T02",c:"T",k:1,type:"mc",q:"2026年分の所得税で、合計所得金額が500万円の人の基礎控除額はどれか。",ch:["104万円","67万円","62万円","58万円"],a:1,e:"489万円超655万円以下は67万円。489万円以下なら104万円、655万円超2,350万円以下は62万円。"},
{id:"T03",c:"T",k:1,q:"2026年分の所得税において、配偶者控除・扶養控除の対象となる親族の合計所得金額の要件は、58万円以下である。",a:"x",e:"基礎控除の引上げにあわせて4万円引き上げられ、62万円以下になった。勤労学生控除は89万円以下。"},
{id:"T04",c:"T",k:1,q:"2026年分・2027年分の給与所得控除の最低保障額は、74万円である。",a:"o",e:"本則が65万円→69万円、さらに2年間の特例で5万円加算され74万円。"},
{id:"T05",c:"T",k:1,q:"マイカー通勤者の通勤手当の非課税限度額は、片道55km以上の場合の月額38,700円が上限である。",a:"x",e:"距離区分が増え、片道95km以上で月額66,400円が上限になった。"},
{id:"T06",c:"T",k:1,q:"確定拠出年金の老齢給付金を一時金で受け取った後、9年以内に退職一時金を受け取った場合、勤続期間が重なる部分は退職一時金の退職所得控除の計算から除かれる。",a:"o",e:"従来は4年以内とされていた。受け取る順番によって有利不利が出ないように見直された。"},
{id:"T07",c:"T",k:0,type:"mc",q:"勤続30年（障害者になったことによる退職ではない）の会社員が退職金2,500万円を受け取った。退職所得の金額はどれか。",ch:["500万円","1,000万円","650万円","1,250万円"],a:0,e:"退職所得控除＝800万円＋70万円×(30年－20年)＝1,500万円。(2,500万円－1,500万円)×1/2＝500万円。"},
{id:"T08",c:"T",k:1,q:"中小企業者等の少額減価償却資産の特例では、取得価額40万円未満の資産について、取得価額の全額を損金に算入することができる。",a:"o",e:"30万円未満から40万円未満に引き上げ。対象法人は従業員400人以下に変更（従前500人以下）。"},
{id:"T09",c:"T",k:1,q:"防衛特別法人税は、2026年4月1日以後に開始する事業年度から、基準法人税額から500万円を控除した額に4％の税率を乗じて課される。",a:"o",e:"基礎控除500万円があるため、多くの中小法人は実際には課税されない。"},
{id:"T09b",c:"T",k:1,q:"住宅ローン控除は、2030年12月31日までに居住した場合に適用でき、控除率は年末残高の1％である。",a:"x",e:"適用期限は2030年末まで延長されたが、控除率は0.7％のまま。"},
{id:"T10",c:"T",k:0,q:"法人が支出した得意先との飲食費のうち、1人あたり1万円以下のものは、一定の書類を保存すれば交際費等から除かれる。",a:"o",e:"2024年4月以後、5,000円以下から1万円以下に引き上げられた。"},
{id:"T11",c:"T",k:0,q:"無申告加算税の割合は、納付すべき税額のうち300万円を超える部分について30％である。",a:"o",e:"50万円以下の部分15％、50万円超300万円以下の部分20％、300万円超の部分30％。"},
{id:"T12",c:"T",k:0,q:"不動産所得の損失の金額のうち、土地を取得するための負債の利子に相当する部分は、他の所得と損益通算することができない。",a:"o",e:"建物部分の利子は通算できる。別荘など生活に通常必要でない資産の貸付による損失も通算不可。"},
{id:"T13",c:"T",k:0,q:"上場株式等の譲渡損失は、確定申告をすることにより、翌年以後5年間にわたって繰り越すことができる。",a:"x",e:"繰越しは3年間。純損失の繰越し（青色申告）も原則3年間。"},
{id:"T14",c:"T",k:0,type:"mc",q:"一時払養老保険（契約者・被保険者・受取人が同じ本人）の満期保険金600万円を受け取った。払込保険料は500万円で、ほかに一時所得はない。総所得金額に算入される金額はどれか。",ch:["100万円","50万円","25万円","0円"],a:2,e:"一時所得＝600万円－500万円－特別控除50万円＝50万円。総所得金額にはその2分の1の25万円を算入。"},
{id:"T15",c:"T",k:0,q:"医療費控除の控除額は、支払った医療費（保険金などで補てんされる額を除く）から、10万円と総所得金額等の5％のいずれか低い額を差し引いた額で、上限は200万円である。",a:"o",e:"セルフメディケーション税制は1万2,000円を超える部分で上限8万8,000円。両方の併用はできない。"},
{id:"T16",c:"T",k:1,q:"特定親族特別控除は、居住者と生計を一にする19歳以上23歳未満の親族で、一定の所得要件を満たす者がいる場合に適用される。",a:"o",e:"大学生世代の子がアルバイトで特定扶養親族から外れても、所得に応じて段階的に控除を受けられる仕組み（2025年分から）。"},
// ---- 不動産 ----
{id:"F01",c:"F",k:1,q:"所有権の登記名義人は、氏名または住所に変更があった日から2年以内に変更登記を申請しなければならず、正当な理由なく怠った場合は5万円以下の過料の対象となる。",a:"o",e:"2026年4月施行。施行前の変更も対象で、原則2028年3月31日までに申請が必要。"},
{id:"F02",c:"F",k:0,q:"相続により不動産の所有権を取得した相続人は、相続により所有権を取得したことを知った日から3年以内に相続登記を申請しなければならない。",a:"o",e:"2024年4月施行。正当な理由なく怠ると10万円以下の過料。施行前の相続も対象。"},
{id:"F03",c:"F",k:1,q:"改正区分所有法では、耐震性の不足など一定の客観的事由がある場合、建替え決議に必要な多数決割合が区分所有者および議決権の各4分の3以上に緩和された。",a:"o",e:"原則は各5分の4以上。大規模滅失時の復旧は4分の3→3分の2に緩和。一括売却・取壊し等の新たな再生手法は原則5分の4。"},
{id:"F04",c:"F",k:1,q:"改正区分所有法では、集会の普通決議は、原則として集会に出席した区分所有者およびその議決権の各過半数で決することができる。",a:"o",e:"「全員の過半数」から「出席者の過半数」になった（出席者多数決）。所在等不明区分所有者を裁判所の決定で母数から除く制度もできた。"},
{id:"F05",c:"F",k:1,q:"新築住宅に係る固定資産税の減額措置（2分の1に減額）の床面積要件は、原則として50㎡以上280㎡以下である。",a:"x",e:"原則40㎡以上240㎡以下に変更された。不動産取得税の新築住宅の軽減措置も原則40㎡以上240㎡以下。"},
{id:"F06",c:"F",k:0,q:"事業用定期借地権等の存続期間は10年以上50年未満で、設定契約は公正証書によらなければならない。",a:"o",e:"一般定期借地権は50年以上（書面または電磁的記録）、建物譲渡特約付借地権は30年以上。普通借地権は30年以上。"},
{id:"F07",c:"F",k:0,q:"定期建物賃貸借契約では、契約期間を1年未満とすることはできない。",a:"x",e:"定期借家は1年未満でも有効。普通借家で1年未満と定めると「期間の定めのない契約」とみなされる。"},
{id:"F08",c:"F",k:0,type:"mc",q:"敷地面積300㎡、指定建蔽率60％の土地（防火地域内、特定行政庁が指定する角地）に耐火建築物を建てる場合、建築面積の最高限度はどれか。",ch:["180㎡","210㎡","240㎡","300㎡"],a:2,e:"防火地域内の耐火建築物で＋10％、角地で＋10％。60％＋20％＝80％。300㎡×80％＝240㎡。"},

const LS="fp1note.v1";
let S={cards:{},kako:[],pq:{},pr:"r12",pc:"",exam:"2027-01-24",log:{}};
let db=null,docRef=null,saveTimer=null,saving=false,pending=false;
function migrate(){S.cards=S.cards||{};Object.entries(S.pq||{}).forEach(([id,v])=>{if(!S.cards[id])S.cards[id]=v});(S.kako||[]).forEach(k=>{const id=`${k.y}_${k.m}_${String(k.no).padStart(2,"0")}`;if(!S.cards[id])S.cards[id]={b:k.b||0,c:0,w:k.w||1,lr:"x",d:k.d}});S.pq={};S.kako=[]}
function loadLocal(){try{const r=localStorage.getItem(LS);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function setSync(t){document.getElementById("sync").textContent=t}
function save(){
  saveLocal();
  if(!docRef)return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(flush,1200);
}
async function flush(){
  if(saving){pending=true;return}
  saving=true;setSync("保存中…");
  try{await docRef.set(JSON.parse(JSON.stringify(S)));setSync("クラウドに保存済み")}
  catch(e){setSync("この端末に保存")}
  saving=false;
  if(pending){pending=false;flush()}
}
async function initCloud(){
  try{
    if(!window.claude||!window.claude.use)return;
    const [d,u]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!d||!u)return;
    const id=await u.id(); if(!id)return;
    db=d; docRef=db.doc("data/users/"+id+"/progress");
    const snap=await docRef.get();
    if(snap.exists){
      const remote=snap.data();
      // 回答数が多い方を採用（端末とクラウドのずれ対策）
      const cnt=o=>Object.values(o.cards||{}).reduce((s,c)=>s+(c.c||0)+(c.w||0),0)+Object.values(o.pq||{}).reduce((s,c)=>s+(c.c||0)+(c.w||0),0)+(o.kako||[]).length;
      if(cnt(remote)>=cnt(S)){S=Object.assign({cards:{},kako:[],pq:{},pr:"r12",pc:"",exam:S.exam,log:{}},JSON.parse(JSON.stringify(remote)));migrate();if(pqState==="ok")migrateGroups();saveLocal()}
      else flush();
    }else if(Object.keys(S.cards).length||Object.keys(S.pq).length){flush()}
    setSync("クラウドに保存済み");
    render();
  }catch(e){setSync("この端末に保存")}
}

/* ===== 公式過去問（金融財政事情研究会 公表の1級学科・基礎編）を1文ずつの〇×問題にしたもの ===== */
// 学科基礎編の分野の並び（目安）：問1-8 ライフ／9-15 リスク／16-24 金融／25-33 タックス／34-41 不動産／42-50 相続
const catOf=no=>no<=8?"L":no<=15?"R":no<=24?"K":no<=33?"T":no<=41?"F":"S";
const EXAMS=[[2026,9],[2026,5],[2026,1],[2025,9],[2025,5],[2025,1],[2024,9],[2024,5],[2024,1],[2023,9],[2023,5],[2023,1],[2022,9],[2022,5],[2022,1]];
// オリジナルの4択問題も〇×に分ける
Q.splice(0,Q.length,...Q.flatMap(q=>q.type!=="mc"?[q]:q.ch.map((t,i)=>({id:q.id+"_"+(i+1),c:q.c,k:q.k,h:q.q+"（次の答えは正しいか）",q:"答え："+t,a:i===q.a?"o":"x",e:q.e}))));
let PQ=[],RAW=[],pqState="loading",IMG={};
/* 「答え：〇〇円」のように4つの答えから選ぶ問題（計算など）は、同じ計算を4回させないよう1問にまとめる。
   出題のたびに4つの答えのうち1つを〇×で出す（半分の確率で正しい答え）。記録は問題単位（id＝親番号_c）。 */
function pickVar(G){
  if(!G.grp)return G;
  const ok=G.grp.filter(v=>v.a==="o"),ng=G.grp.filter(v=>v.a!=="o");
  const pool=ok.length&&(Math.random()<.5||!ng.length)?ok:ng;
  const v=pool[Math.floor(Math.random()*pool.length)];
  Object.assign(G,{q:v.s,s:v.s,a:v.a,e:v.e,law:v.law,vid:v.id});
  return G;
}
function groupCalc(list){
  const by={};list.forEach(o=>(by[o.p]=by[o.p]||[]).push(o));
  const out=[],seen={};
  for(const o of list){
    const g=by[o.p];
    if(!g.every(x=>/^答え：/.test(x.s))){out.push(o);continue}
    if(seen[o.p])continue;seen[o.p]=1;
    out.push(pickVar({...g[0],id:o.p+"_c",grp:g}));
  }
  return out;
}
// 以前に1文ずつ解いた記録を、まとめた問題に引き継ぐ
function migrateGroups(){
  if(!S||!S.cards)return;
  for(const G of PQ){
    if(!G.grp)continue;
    if(!S.cards[G.id]){const cs=G.grp.map(v=>S.cards[v.id]).filter(Boolean).sort((a,b)=>(b.t||"")<(a.t||"")?-1:1);if(cs.length)S.cards[G.id]={...cs[0]}}
    if(S.pass&&G.grp.some(v=>S.pass[v.id])&&!S.pass[G.id]){S.pass[G.id]=G.grp.map(v=>S.pass[v.id]).filter(Boolean).sort()[0]}
    if(S.pass)G.grp.forEach(v=>delete S.pass[v.id]);
  }
}

async function loadPast(){
  try{
    RAW=[];
    for(const f of ["pasttf1.json","pasttf2.json"]){const r=await fetch(f);if(!r.ok)throw 0;const j=await r.json();RAW.push(...j.items.map(o=>({...o,h:j.h[o.p],pt:(j.pt||{})[o.p],q:o.s,c:catOf(o.no),past:true})))}
    PQ=groupCalc(RAW);migrateGroups();

}

function passQ(){const P=S.pass||{};return ALL().filter(q=>P[q.id]).sort((a,b)=>P[a.id]<P[b.id]?-1:P[a.id]>P[b.id]?1:0)}
function doPass(q){S.pass=S.pass||{};S.pass[q.id]=S.pass[q.id]||today();save();session.passed=(session.passed||0)+1;session.i++;session.answered=null;renderQuiz();window.scrollTo(0,0)}
function statFor(list){
  let m=0,l=0,w=0;
  list.forEach(q=>{const c=card(q.id);if(!c)return;if(c.lr==="x")w++;else if(c.b>=3)m++;else l++});
  return {m,l,w,n:list.length,untouched:list.length-m-l-w};
}
function streak(){let n=0;for(let i=0;;i++){const d=addDays(-i);if(S.log[d])n++;else if(i>0)break;else continue;}return n}

/* ===== 電卓（計算問題のとき表示） ===== */
const isCalcQ=q=>!!q.img||/^答え：/.test(q.q||"");
let CALC={id:null,ex:"",open:false};
const calcShow=t=>t.replace(/\*/g,"×").replace(/\//g,"÷").replace(/-/g,"−");
function calcEval(src){
  let i=0;const s=src;
  const num=()=>{const m=/^\d*\.?\d+|^\d+\./.exec(s.slice(i));if(!m)throw 0;i+=m[0].length;return parseFloat(m[0])};
  const prim=()=>{if(s[i]==="("){i++;const v=expr();if(s[i]===")")i++;return v}return num()};
  const unary=()=>{if(s[i]==="-"){i++;return -unary()}if(s[i]==="√"){i++;const v=unary();if(v<0)throw 0;return Math.sqrt(v)}let v=prim();while(s[i]==="%"){i++;v/=100}return v};
  const pow=()=>{const b=unary();if(s[i]==="^"){i++;return Math.pow(b,pow())}return b};
  const term=()=>{let v=pow();while(s[i]==="*"||s[i]==="/"){const o=s[i++];const r=pow();v=o==="*"?v*r:v/r}return v};
  function expr(){let v=term();while(s[i]==="+"||s[i]==="-"){const o=s[i++];const r=term();v=o==="+"?v+r:v-r}return v}
  const v=expr();if(i<s.length||!isFinite(v))throw 0;return v;
}
function calcFmt(v){const r=Math.round(v*1e8)/1e8;return r.toLocaleString("ja-JP",{maximumFractionDigits:8})}
function calcHTML(q){
  if(CALC.id!==q.id){CALC={id:q.id,ex:"",open:CALC.open}}
  const K=[["C","AC"],["(","("],[")",")"],["⌫","BS"],["√","√"],["^","^"],["%","%"],["÷","/"],["7","7"],["8","8"],["9","9"],["×","*"],["4","4"],["5","5"],["6","6"],["−","-"],["1","1"],["2","2"],["3","3"],["＋","+"],["0","0"],["00","00"],[".","."],["＝","EQ"]];
  return `<details class="calc" ${CALC.open?"open":""}><summary>🧮 電卓を使う</summary>
    <div class="disp" aria-live="polite"><div class="ex" id="cex"></div><div class="res" id="cres"></div></div>
    <div class="keys">${K.map(([t,k])=>`<button class="btn ${/^[\d.]+$/.test(k)?"":"op"} ${k==="EQ"?"primary":""}" data-ck="${k}" aria-label="${t==="^"?"累乗":t==="√"?"ルート":t==="⌫"?"1文字消す":t==="C"?"クリア":t}">${t}</button>`).join("")}</div>
    <p class="note" style="margin:6px 0 0">√ はルート、^ は累乗（例：1.03^5）、% は100分の1。式の途中でも答えが表示されます。</p></details>`;
}
function calcBind(q){
  const box=V.querySelector(".calc");if(!box)return;
  const ex=box.querySelector("#cex"),res=box.querySelector("#cres");
  const show=()=>{ex.textContent=calcShow(CALC.ex)||"0";let r="";if(CALC.ex){try{r="＝ "+calcFmt(calcEval(CALC.ex))}catch(e){r=""}}res.textContent=r};
  box.addEventListener("toggle",()=>{CALC.open=box.open});
  box.querySelectorAll("[data-ck]").forEach(b=>b.addEventListener("click",()=>{
    const k=b.dataset.ck;
    if(k==="AC")CALC.ex="";
    else if(k==="BS")CALC.ex=CALC.ex.slice(0,-1);
    else if(k==="EQ"){try{CALC.ex=String(Math.round(calcEval(CALC.ex)*1e10)/1e10)}catch(e){res.textContent="式を確認してください";return}}
    else CALC.ex+=k;
    show();
  }));
  show();
}
function answer(q,pick){
  const ok=pick===q.a;   // pick==="u"（わからない）は不正解あつかい
  session.answered={ok,pick};
  if(S.pass&&S.pass[q.id])delete S.pass[q.id];
  if(ok)session.ok++;else session.ng++;
  S.log[today()]=(S.log[today()]||0)+1;
  renderQuiz();
}
function rate(q,how){
  const c=S.cards[q.id]||{b:0,c:0,w:0};
  if(how==="wrong"){c.b=0;c.w++;c.lr="x";c.d=addDays(STEPS[0])}
  else if(how==="unsure"){c.c++;c.lr="o";c.b=1;c.d=addDays(STEPS[0])}
  else{c.c++;c.lr="o";c.b=Math.min(c.b+1,STEPS.length-1);c.d=addDays(STEPS[c.b])}
  c.t=today();S.cards[q.id]=c;save();
  session.i++;session.answered=null;renderQuiz();window.scrollTo(0,0);
}

  V.querySelectorAll("[data-cell]").forEach(b=>b.onclick=()=>{const [y,m,no]=b.dataset.cell.split("-").map(Number);start(PQ.filter(q=>q.y===y&&q.m===m&&q.no===no),`${y}年${m}月 問${no}`)});

/* ===== 音声（読み上げ・声で回答） =====
   kbd  … 読み上げ＋スマホのキーボードの音声入力で回答（claude.ai の中でも使える）
   free … 読み上げ＋マイクで回答（画面に触らずに続ける。マイクが使える場所＝GitHub Pages版で動く） */
const PAGES_URL="https://ohakkome-collab.github.io/fp1/";   // 手放しモード用の公開ページ（GitHub Pages）
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const canSpeak="speechSynthesis" in window;
const V_DEF={mode:"off",rate:1.2,head:true};
const vset=()=>Object.assign({},V_DEF,S.voice||{});
let vOn=false,vRec=null,vBusy=false,vMicBlocked=false;
function vClean(t){
  return String(t).replace(/〇|○/g,"まる").replace(/×/g,"ばつ").replace(/答え：/,"答えは、")
    .replace(/（＝保険料負担者）/g,"").replace(/㎡/g,"平方メートル").replace(/～|〜/g,"から")
    .replace(/[（(]以下、「[^」]+」という[)）]/g,"").replace(/\s+/g," ");
}
function speak(text,cb){
  if(!canSpeak){cb&&cb();return}
  {const r=vRec;vRec=null;try{r&&r.abort()}catch(e){}}  // 読み上げ中は聞き取りを止める（自分の声を拾わないように）
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(vClean(text));
  u.lang="ja-JP";u.rate=vset().rate;
  const ja=speechSynthesis.getVoices().find(v=>/^ja/i.test(v.lang));if(ja)u.voice=ja;
  let done=false;const fin=()=>{if(done)return;done=true;cb&&cb()};
  u.onend=fin;u.onerror=fin;
  speechSynthesis.speak(u);
}
function vStop(){
  vOn=false;vBusy=false;
  try{canSpeak&&speechSynthesis.cancel()}catch(e){}
  try{vRec&&vRec.abort()}catch(e){}
  vRec=null;
}
// 聞き取った言葉を判定（聞き間違いやすい言い方も広く受け付ける）
const W_O=/正しい|ただしい|タダシイ|正解|せいかい|あってる|合ってる|あっている|合っている|その通り|そのとおり|まる|マル|丸|〇|○|◯|まーる|マール|はい|ハイ|はーい|イエス|いえす|yes|適切|てきせつ|オッケー|おっけー|^ok$|^o$|^オー$|^王$|^円$|^春$|^猿$|^ある$|^まあ$|^まぁ$|^マー$/i;
const W_X=/違う|ちがう|チガウ|違います|ちがいます|間違|まちが|マチガ|ばつ|バツ|罰|ぺけ|ペケ|×|✕|✖|いいえ|イイエ|いえ$|ノー|^no$|ダメ|だめ|駄目|不適切|ふてきせつ|誤り|あやまり|不正解|^抜|^伐|^ばっ|^バッ|^発$|^八$|^パツ$/i;
function vParse(t){
  t=String(t).replace(/[\s。、．,.!！?？]/g,"");
  if(!t)return null;
  if(/もう一度|もういちど|もう一回|もう1回|もういっかい|もっかい|もう1度|繰り返|くりかえ|リピート|聞き直|ききなお|読み直|よみなお/.test(t))return"repeat";
  if(/パス|ぱす|スキップ|あとで|後で|後回し|あとまわし/.test(t))return"pass";
  if(/教えて|おしえて|家庭教師|先生|質問/.test(t))return"tutor";
  if(/わからない|分からない|判らない|わかんない|分かんない|わかりません|分かりません|知らない|しらない|ギブアップ|降参|こうさん/.test(t))return"unknown";
  if(/あやし|怪し|アヤシ|微妙|自信ない|自信がない/.test(t))return"unsure";
  if(/覚えた|おぼえた|オボエタ|覚えてる|ばっちり|バッチリ|自信ある|余裕/.test(t))return"sure";
  if(/^(次|つぎ|ツギ|すすむ|進む|進んで|ネクスト|next)/i.test(t))return"next";
  if(/やめ|ストップ|終わり|おわり|止めて|とめて/.test(t))return"stop";
  if(W_X.test(t))return"x";      // 「正しくない」などを先に「ばつ」と判定
  if(/正しくない|ただしくない/.test(t))return"x";
  if(W_O.test(t))return"o";
  return null;
}
function vListen(onWord,onNone){
  if(!SR||vMicBlocked){onNone&&onNone("nomic");return}
  {const old=vRec;vRec=null;try{old&&old.abort()}catch(e){}}
  const r=new SR();vRec=r;
  r.lang="ja-JP";r.interimResults=true;r.maxAlternatives=10;r.continuous=true;   // 黙っていてもすぐ切れないように続けて聞く
  let got=false;
  r.onresult=e=>{
    if(got)return;
    // 途中経過も含めて、すべての候補から最初にわかった言葉を使う
    for(let i=e.resultIndex;i<e.results.length;i++){
      for(const a of e.results[i]){const w=vParse(a.transcript);if(w){got=true;try{r.abort()}catch(_){}vRec=null;onWord(w,a.transcript);return}}
    }
  };
  r.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed"||e.error==="audio-capture"){vMicBlocked=true;got=true;onNone&&onNone("nomic")}};
  r.onend=()=>{if(vRec!==r)return;vRec=null;if(!got&&vOn)onNone&&onNone("none")};
  try{r.start()}catch(e){onNone&&onNone("nomic")}
}
function vStatus(t){const el=document.getElementById("vstat");if(el)el.textContent=t}
// 問題の画面が表示されるたびに呼ばれる
function voiceAfterRender(q,done){
  const v=vset();if(v.mode==="off"||!vOn||!session)return;
  const kbd=document.getElementById("vin");
  if(!done){
    const txt=q.img
      ?"資料つきの問題です。"+(q.vh||q.h||"")+"では、次の文は正しいか。"+q.q+"。正しい？ 違う？"
      :(v.head&&q.h?q.h+"。":"")+q.q+"。正しい？ 違う？";
    speak(txt,()=>{
      if(!vOn||session?.answered)return;
      if(v.mode==="free"){vStatus("🎤 聞いています（ゆっくり考えてOK）…「正しい」「ちがう」「わからない」「パス」／「もう一度」で読み直し");listenAnswer(q)}
      else{vStatus("キーボードのマイクで「正しい」か「ちがう」（まる・ばつでもOK）");kbd&&kbd.focus()}
    });
  }else{
    const isO=q.a==="o";
    let txt=(done.ok?"正解。":done.pick==="u"?"わからない、ですね。":"不正解。")+"この文は、"+(isO?"まる":"ばつ")+"です。";
    if(q.past&&changed(q))txt+="法改正で答えが変わった文です。";
    if(S.my&&S.my[q.id])txt+="自分専用の解説。"+S.my[q.id].t+"。";
    if(q.e)txt+="解説。"+q.e;
    if(q.pt){txt+="合格ポイント。"+q.pt.s+(q.pt.c?"覚え方。"+q.pt.c:"")+(q.pt.r&&q.pt.r.length?"あわせて出やすいこと。"+q.pt.r.join("。"):"")+"。"}
    txt+=done.ok?"覚えた？ あやしい？":"";
    speak(txt,()=>{
      if(!vOn||!session||!session.answered)return;
      if(v.mode==="free"){
        vStatus(done.ok?"📖 読み終わったら「覚えた」「あやしい」「次」と言ってください（「もう一度」で読み直し・「教えて」で家庭教師）":"📖 読み終わったら「次」と言ってください（「もう一度」で読み直し・「教えて」で家庭教師）");
        waitNext(q,done);
      }else{vStatus(done.ok?"「覚えた」か「あやしい」と入力":"「次」と入力すると進みます");kbd&&kbd.focus()}
    });
  }
}
// 解説のあとは、こちらが合図するまで画面を閉じずに待つ
function waitNext(q,done,until){
  if(!until)until=Date.now()+V_WAIT*2;
  if(!vOn||!session||session.answered!==done)return;
  if(Date.now()>until){vStatus("⏸ 聞き取りを休みました。「もう一度読む」で再開できます");return}
  vListen(w=>{
    if(w==="stop")return vEnd();
    if(w==="repeat")return voiceAfterRender(q,done);
    if(w==="tutor"||w==="unknown")return tutorVoice(q,done,true);
    if(done.ok&&(w==="sure"||w==="unsure"||w==="next"))return rate(q,w==="unsure"?"unsure":"sure");
    if(!done.ok&&(w==="next"||w==="o"||w==="x"))return rate(q,"wrong");
    waitNext(q,done,until);
  },why=>{
    if(why==="nomic"){vStatus("このページではマイクが使えません");vMicNote();return}
    setTimeout(()=>waitNext(q,done,until),300);
  });
}
// 答えを待つ：黙って考えていても、最長5分は聞き取りを続ける
const V_WAIT=5*60*1000;
function listenAnswer(q,until){
  if(!until)until=Date.now()+V_WAIT;
  if(!vOn||!session||session.answered)return;
  if(Date.now()>until){vStatus("⏸ 長く答えがなかったので聞き取りを休みました。「もう一度読む」で再開できます");return}
  vListen(w=>{
    if(w==="stop")return vEnd();
    if(w==="o"||w==="x")return answer(q,w);
    if(w==="unknown")return answer(q,"u");
    if(w==="pass")return doPass(q);
    if(w==="repeat")return voiceAfterRender(q,null);
    listenAnswer(q,until);
  },why=>{
    if(why==="nomic"){vStatus("このページではマイクが使えません");vMicNote();return}
    setTimeout(()=>listenAnswer(q,until),300);   // 切れたら少し待って聞き直す
  });
}
function vEnd(){vStop();vStatus("音声を止めました");const b=document.getElementById("vgo");if(b)b.textContent="🔊 音声スタート"}
function vMicNote(){
  const el=document.getElementById("vmic");if(!el)return;
  el.hidden=false;
  el.innerHTML=PAGES_URL?`このページ（claude.ai）ではマイクが使えません。手放しモードは <a href="${PAGES_URL}" target="_blank" rel="noopener">GitHub Pages版</a> で使ってください。今は「キーボードの音声入力」モードに切り替えると、このページでも声で答えられます。`:`このページではマイクが使えません。「キーボードの音声入力」モードに切り替えると、声で答えられます。`;
}
// 問題画面の音声パーツ（ボタンと入力欄）
function voiceBar(done){

    </div>
    ${v.mode==="kbd"?`<input id="vin" type="text" inputmode="text" autocomplete="off" placeholder="🎤 「正しい」「ちがう」と話す" aria-label="声で答える（キーボードの音声入力）">`:""}

}
function voiceBind(q){
  const v=vset();if(v.mode==="off")return;
  const go=document.getElementById("vgo"),again=document.getElementById("vagain"),inp=document.getElementById("vin");
  go&&go.addEventListener("click",()=>{if(vOn){vEnd()}else{vOn=true;go.textContent="⏹ 音声を止める";voiceAfterRender(q,session&&session.answered)}});

  inp&&inp.addEventListener("input",()=>{
    const w=vParse(inp.value);if(!w)return;
    inp.value="";
    if(w==="stop")return vEnd();

    if(w==="repeat")return voiceAfterRender(q,done);
    if(!done&&(w==="o"||w==="x"))answer(q,w);
    else if(!done&&w==="unknown")answer(q,"u");
    else if(!done&&w==="pass")doPass(q);
    else if(done&&done.ok&&(w==="sure"||w==="unsure"))rate(q,w);
    else if(done&&!done.ok&&(w==="next"||w==="o"||w==="x"))rate(q,"wrong");
    else if(done&&done.ok&&w==="next")rate(q,"sure");
  });
}

/* ===== AI家庭教師（Gemini 無料枠）＋ Claudeに聞く =====

const AI_KEY="fp1_gemini_key",AI_MODEL="fp1_gemini_model",AI_USE="fp1_ai_use";
const lsGet=k=>{try{return localStorage.getItem(k)||""}catch(e){return""}};
const lsSet=(k,v)=>{try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}};
const ON_PAGES=/github\.io$|^localhost$|^127\.0\.0\.1$/.test(location.hostname);   // 家庭教師（Gemini）はGitHub Pages版で使う

let TUT={qid:null,msgs:[],busy:false,err:""};
const TUT_SYS=`あなたはFP1級学科試験（基礎編）の家庭教師です。相手は専門用語に慣れていない社会人の受験者で、スマホで勉強しています。
ルール：
・2026年10月1日時点の法令で説明する。下に渡す「アプリの解説」「法改正メモ」を正しい前提として扱い、食い違いそうなときは「公式の解説を優先してね」と添える。
・耳で聞いてもわかる話し言葉で、1回の返事は300字以内。箇条書き記号、太字、見出しなどの記号は使わない。

<<確認|o|問題文|ひとことの理由>>　（正しい文なら o、誤りの文なら x。問題文は「まる？ ばつ？」を除いた文だけ）`;
function tutorContext(q){
  const sib=(RAW||[]).filter(x=>x.p===q.p).map(x=>`${x.a==="o"?"〇":"×"} ${x.s}${x.e?"（解説："+x.e+"）":""}`).join("\n");

${q.vh?"【資料の内容】"+q.vh+"\n":""}【いま出題した文】${q.q}
【正解】${q.a==="o"?"〇（正しい）":"×（誤り）"}
【アプリの解説】${q.e||"なし"}
${q.pt?"【合格ポイント】"+q.pt.s+" 覚え方："+(q.pt.c||"")+" あわせて出やすいこと："+(q.pt.r||[]).join("／")+"\n":""}
${q.law&&q.law.t?"【法改正メモ】"+q.law.t+"\n":""}${sib?"【同じ問題のほかの文】\n"+sib:""}`;

// 時間切れつきの通信（返事が来ないまま待ち続けないように）
async function fetchTO(url,opt,ms){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);try{return await fetch(url,{...opt,signal:c.signal})}finally{clearTimeout(t)}}
// 使えるAI（Geminiのモデル）の候補を、良さそうな順に並べる。うまくいったものを覚えておく
async function aiModels(key){
  let names=[];
  try{
    const r=await fetchTO("https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000",{headers:{"x-goog-api-key":key}},12000);
    if(r.status===400||r.status===401||r.status===403){const j=await r.json().catch(()=>({}));const e=new Error("key");e.detail=aiDetail(r.status,j);throw e}
    if(r.ok){const j=await r.json();
      names=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")).map(m=>m.name.replace(/^models\//,""))
        .filter(n=>/^gemini-[\d.]+-flash/.test(n)&&!/image|tts|audio|live|embed|vision|native|computer/.test(n));
      const ver=n=>parseFloat((n.match(/gemini-([\d.]+)/)||[0,0])[1]);
      const score=n=>ver(n)*10-(/lite/.test(n)?5:0)-(/preview|exp/.test(n)?1:0);
      names.sort((a,b)=>score(b)-score(a));
    }
  }catch(e){if(e.message==="key")throw e}
  const saved=lsGet(AI_MODEL);
  return [...new Set([saved,...names,"gemini-flash-latest","gemini-flash-lite-latest","gemini-2.5-flash","gemini-2.5-flash-lite"].filter(Boolean))];
}
function aiDetail(status,j){const m=j&&j.error&&(j.error.message||j.error.status);return `（${status}${m?"："+String(m).slice(0,120):""}）`}
async function aiCall(contents,onStep){
  const key=aiKey();if(!key)throw new Error("nokey");

  let last=null;
  for(const [i,model] of list.entries()){
    onStep&&onStep(`${model} につないでいます（${i+1}/${list.length}）…`);
    let r,j={};
    try{r=await fetchTO(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},body:JSON.stringify({systemInstruction:{parts:[{text:TUT_SYS}]},contents,generationConfig:{temperature:0.4,maxOutputTokens:4096}})},25000)}
    catch(e){
